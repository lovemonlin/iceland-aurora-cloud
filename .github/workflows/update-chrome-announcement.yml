name: Update Chrome announcement

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-chrome-announcement
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test announcement generator
        run: python -m unittest -v test_generate_chrome_announcement.py
      - name: Generate announcement config from Notion
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
        run: python generate_chrome_announcement.py --output chrome-config.json
      - name: Publish updated announcement config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chrome-config.json
          git diff --cached --quiet || git commit -m "Update Chrome announcement"
          git push
