name: Update ECMWF cloud forecast

on:
  schedule:
    - cron: "20 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install forecast generator
        run: pip install -r requirements.txt
      - name: Download ECMWF and generate forecast frames
        run: |
          for attempt in 1 2 3; do
            if python generate_cloud_frames.py --output . --public-base-url https://lovemonlin.github.io/iceland-aurora-cloud; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "ECMWF forecast generation failed after 3 attempts."
              exit 1
            fi

            echo "Attempt $attempt failed; retrying in 30 seconds."
            sleep 30
          done
      - name: Publish updated forecast files
        run: |
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json tcc-*.png .nojekyll
          git diff --cached --quiet || git commit -m "Update ECMWF cloud forecast"
          git push
